[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bigbang-eval"
version = "0.1.0"
description = "Minimal public evaluation harness for BigBang-v1"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0,<5",
    "e2b-code-interpreter>=2.6,<3",
    "httpx>=0.27,<1",
    "huggingface-hub>=0.25,<2",
    "jinja2>=3.1,<4",
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]

[tool.ruff]
line-length = 100
target-version = "py310"
